---
- name: Install and configure Nginx on web servers
  hosts: webservers
  become: true
  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.package:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure Nginx service is started and enabled on boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify that Nginx is listening on port 80
      ansible.builtin.wait_for:
        port: 80
        host: localhost
        timeout: 10