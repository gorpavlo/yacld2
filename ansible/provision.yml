---
- name: Configure VMs with Nginx
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx service
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Create custom index.html
      copy:
        content: |
          <html>
            <head>
              <title>VM {{ inventory_hostname }}</title>
            </head>
            <body>
              <h1>Hello from VM {{ inventory_hostname }}!</h1>
              <p>Instance ID: {{ ansible_hostname }}</p>
              <p>IP Address: {{ ansible_default_ipv4.address }}</p>
            </body>
          </html>
        dest: /var/www/html/index.html